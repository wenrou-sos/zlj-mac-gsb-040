[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes；I: import 排序；UP: py 现代化；B: bugbear
select = ["E", "F", "I", "UP", "B"]
# C408: Plotly 惯例大量使用 dict(...) 构造图形参数，属于可接受写法
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
# 测试脚本中使用列表推导 + [0] 取控件更直观
"tests/*" = ["E501"]
